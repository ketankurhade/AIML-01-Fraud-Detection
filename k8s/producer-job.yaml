apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-producer-simulator
  namespace: fraud-platform
  labels:
    app: fraud-producer
    component: streaming-generator
    app.kubernetes.io/name: fraud-producer-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-producer
  template:
    metadata:
      labels:
        app: fraud-producer
        component: streaming-generator
    spec:
      containers:
        - name: producer-simulator
          image: fraud-producer-simulator:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fraud-platform-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

